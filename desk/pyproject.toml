[project]
name = "desk"
version = "0.1.0"
description = "The Desk — engine that evaluates priced football matches and publishes verdicts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "anthropic>=0.40,<1.0",
    "apscheduler>=3.10,<4.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=15,<19",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
desk = "desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    # `copy` is part of the public output contract; we accept Pydantic's
    # warning that it shadows BaseModel.copy (now model_copy in v2).
    "ignore:Field name \"copy\" in \"MatchOutput\" shadows.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
