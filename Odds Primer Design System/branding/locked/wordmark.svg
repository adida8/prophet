<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50" aria-label="Odds Primer">
  <!-- Locked v2 · glyph (heights 22·38·65·30) + Source Serif 4 800 wordmark · 11px gap -->
  <!-- Note: wordmark relies on Source Serif 4 being available in the rendering context.
       For environments without web fonts (social cards, email, native rasterizers),
       export an outlined-paths variant via your design tool of choice. -->
  <style>
    .wm-text {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 800;
      font-size: 36px;
      letter-spacing: -0.012em;
      fill: #0E2240;
    }
  </style>
  <!-- glyph -->
  <g transform="translate(0, 0)">
    <line x1="2" y1="46" x2="54" y2="46" stroke="#0E2240" stroke-width="1.25"/>
    <rect x="6"  y="32" width="6" height="14" fill="#0E2240"/>
    <rect x="16" y="22" width="6" height="24" fill="#0E2240"/>
    <rect x="26" y="8"  width="6" height="38" fill="#D9461C"/>
    <rect x="36" y="28" width="6" height="18" fill="#0E2240"/>
  </g>
  <!-- wordmark · 11px gap from glyph right edge (x=42) → wordmark start (x=53) -->
  <text x="65" y="40" class="wm-text">Odds Primer</text>
</svg>
