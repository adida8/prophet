<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="margin-bottom:14px;"><span class="eyebrow">Radii · Hairlines · Shadows</span></div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; align-items:flex-end;">
    <div style="text-align:center;"><div style="height:60px; background:var(--paper-pure); border:1px solid var(--rule); border-radius:0;"></div><div class="eyebrow" style="margin-top:6px;">0 · sections</div></div>
    <div style="text-align:center;"><div style="height:60px; background:var(--paper-pure); border:1px solid var(--rule); border-radius:4px;"></div><div class="eyebrow" style="margin-top:6px;">4 · buttons</div></div>
    <div style="text-align:center;"><div style="height:60px; background:var(--paper-pure); border:1px solid var(--rule); border-radius:6px;"></div><div class="eyebrow" style="margin-top:6px;">6 · cards</div></div>
    <div style="text-align:center;"><div style="height:60px; background:var(--paper-pure); border:1px solid var(--rule); border-radius:999px;"></div><div class="eyebrow" style="margin-top:6px;">pill · tags</div></div>
  </div>
  <div style="margin-top:18px; padding-top:12px; border-top:1px solid var(--rule); display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;">
    <div style="height:72px; background:var(--paper-pure); border-radius:6px; box-shadow: 0 1px 0 var(--rule); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--graphite-soft);"><span class="eyebrow">Shadow 1 · sticky</span></div>
    <div style="height:72px; background:var(--paper-pure); border-radius:6px; box-shadow: 0 1px 2px rgba(14,34,64,0.06), 0 0 0 1px var(--rule); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--graphite-soft);"><span class="eyebrow">Shadow 2 · active</span></div>
    <div style="height:72px; background:var(--paper-pure); border-radius:6px; box-shadow: 0 8px 24px rgba(14,34,64,0.08), 0 0 0 1px var(--rule); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--graphite-soft);"><span class="eyebrow">Shadow 3 · menu</span></div>
  </div>
</div>
</body></html>
