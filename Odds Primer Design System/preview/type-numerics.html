<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="margin-bottom:14px;"><span class="eyebrow">Type · Numerics · JetBrains Mono · tabular</span></div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:18px;">
    <div>
      <div class="mono" style="font-size:36px; font-weight:600; color:var(--ink); letter-spacing:-0.01em;">16¢</div>
      <div class="eyebrow" style="margin-top:4px;">Polymarket</div>
    </div>
    <div>
      <div class="mono" style="font-size:36px; font-weight:600; color:var(--ink); letter-spacing:-0.01em;">14¢</div>
      <div class="eyebrow" style="margin-top:4px;">Kalshi</div>
    </div>
    <div>
      <div class="mono" style="font-size:36px; font-weight:600; color:var(--ink); letter-spacing:-0.01em;">+550</div>
      <div class="eyebrow" style="margin-top:4px;">DraftKings</div>
    </div>
    <div>
      <div class="mono" style="font-size:36px; font-weight:600; color:var(--flame); letter-spacing:-0.01em;">+625</div>
      <div class="eyebrow" style="margin-top:4px; color:var(--flame);">Best · FanDuel</div>
    </div>
  </div>
  <div style="margin-top:18px; padding-top:12px; border-top:1px solid var(--rule); font-size:11px; color:var(--graphite-soft);">
    <span class="mono">tabular-nums · 500 · ss01 · cols stay aligned across rows</span>
  </div>
</div>
</body></html>
