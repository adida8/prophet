<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" data-palette="warm-editorial">
  <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;">
    <span class="eyebrow">Palette · Warm editorial · default</span>
    <span class="eyebrow" style="color:var(--graphite);">cream paper · ink · flame</span>
  </div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:8px;">
    <div><div style="height:64px; background:var(--paper); border:1px solid var(--rule); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Paper</div><div class="mono" style="color:var(--graphite-soft);">#FAF7F0</div></div></div>
    <div><div style="height:64px; background:var(--paper-warm); border:1px solid var(--rule); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Warm</div><div class="mono" style="color:var(--graphite-soft);">#F0ECE2</div></div></div>
    <div><div style="height:64px; background:var(--ink); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Ink</div><div class="mono" style="color:var(--graphite-soft);">#0E2240</div></div></div>
    <div><div style="height:64px; background:var(--graphite); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Graphite</div><div class="mono" style="color:var(--graphite-soft);">#3A3F47</div></div></div>
    <div><div style="height:64px; background:var(--flame); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Flame</div><div class="mono" style="color:var(--graphite-soft);">#D9461C</div></div></div>
    <div><div style="height:64px; background:var(--flame-tint); border:1px solid var(--rule); border-radius:4px;"></div><div style="margin-top:6px; font-size:11px;"><div style="font-weight:600;">Flame tint</div><div class="mono" style="color:var(--graphite-soft);">#F7E4DA</div></div></div>
  </div>
  <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--rule); display:flex; gap:24px; align-items:center;">
    <div style="font-family:var(--font-serif); font-size:18px; line-height:1.4;">France <span class="mono" style="color:var(--flame);">16¢</span> on Polymarket — the <em>best</em> price†</div>
  </div>
</div>
</body></html>
