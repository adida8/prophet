<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;">
    <span class="eyebrow">Components · Comparison row · the atomic unit</span>
    <span class="eyebrow" style="color:var(--graphite);">"will France win the 2026 World Cup?"</span>
  </div>
  <div style="background:var(--paper-pure); border:1px solid var(--rule); border-radius:6px;">
    <!-- header row -->
    <div style="display:grid; grid-template-columns: 1fr 80px 80px 80px 90px; padding:10px 16px; border-bottom:1px solid var(--rule); font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--graphite-soft);">
      <div>Venue</div><div style="text-align:right;">Price</div><div style="text-align:right;">Implied</div><div style="text-align:right;">7d Δ</div><div></div>
    </div>
    <!-- best -->
    <div style="display:grid; grid-template-columns: 1fr 80px 80px 80px 90px; padding:14px 16px; border-bottom:1px solid var(--rule-soft); align-items:center; background:var(--flame-tint);">
      <div style="display:flex; align-items:center; gap:10px;"><span style="width:8px; height:8px; border-radius:50%; background:#2A6FDB;"></span><span style="font-family:var(--font-sans); font-weight:600; font-size:14px;">Polymarket</span><span style="font-family:var(--font-sans); font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:2px 8px; background:var(--flame); color:var(--paper); border-radius:999px;">Best</span></div>
      <div class="mono" style="text-align:right; font-weight:600; color:var(--ink);">16¢</div>
      <div class="mono" style="text-align:right; color:var(--ink);">16.0%</div>
      <div class="mono" style="text-align:right; color:var(--graphite);">+1.2</div>
      <div style="text-align:right;"><a style="font-family:var(--font-sans); font-size:12px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule);">Open ↗</a></div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 80px 80px 80px 90px; padding:14px 16px; border-bottom:1px solid var(--rule-soft); align-items:center;">
      <div style="display:flex; align-items:center; gap:10px;"><span style="width:8px; height:8px; border-radius:50%; background:#00C46A;"></span><span style="font-family:var(--font-sans); font-weight:500; font-size:14px;">Kalshi</span></div>
      <div class="mono" style="text-align:right; color:var(--ink);">14¢</div>
      <div class="mono" style="text-align:right; color:var(--ink);">14.0%</div>
      <div class="mono" style="text-align:right; color:var(--graphite);">−0.4</div>
      <div style="text-align:right;"><a style="font-family:var(--font-sans); font-size:12px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule);">Open ↗</a></div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 80px 80px 80px 90px; padding:14px 16px; align-items:center;">
      <div style="display:flex; align-items:center; gap:10px;"><span style="width:8px; height:8px; border-radius:50%; background:#6B7079;"></span><span style="font-family:var(--font-sans); font-weight:500; font-size:14px;">DraftKings</span><span style="font-family:var(--font-sans); font-size:11px; color:var(--graphite-soft);">+550</span></div>
      <div class="mono" style="text-align:right; color:var(--ink);">15.4%</div>
      <div class="mono" style="text-align:right; color:var(--ink);">15.4%</div>
      <div class="mono" style="text-align:right; color:var(--graphite);">+0.6</div>
      <div style="text-align:right;"><a style="font-family:var(--font-sans); font-size:12px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule);">Open ↗</a></div>
    </div>
  </div>
</div>
</body></html>
