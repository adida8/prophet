<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="margin-bottom:14px;"><span class="eyebrow">Components · Buttons</span></div>
  <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
    <button style="font-family:var(--font-sans); font-weight:500; font-size:14px; padding:10px 18px; background:var(--ink); color:var(--paper); border:0; border-radius:4px; cursor:pointer;">Compare venues</button>
    <button style="font-family:var(--font-sans); font-weight:500; font-size:14px; padding:10px 18px; background:transparent; color:var(--ink); border:1px solid var(--ink); border-radius:4px; cursor:pointer;">Read primer</button>
    <button style="font-family:var(--font-sans); font-weight:500; font-size:14px; padding:10px 18px; background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:4px; cursor:pointer;">Filter</button>
    <a style="font-family:var(--font-sans); font-weight:500; font-size:14px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;">View source on Kalshi ↗</a>
  </div>
  <div style="margin-top:14px; display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
    <button style="font-family:var(--font-sans); font-weight:500; font-size:13px; padding:6px 12px; background:var(--ink); color:var(--paper); border:0; border-radius:4px;">Small primary</button>
    <button style="font-family:var(--font-sans); font-weight:500; font-size:13px; padding:6px 12px; background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:4px;">Small ghost</button>
    <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; background:var(--flame-tint); color:var(--flame-deep); border-radius:999px;">Best price</span>
    <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; background:var(--paper-warm); color:var(--graphite); border-radius:999px;">Group A</span>
  </div>
  <div style="margin-top:14px; padding-top:10px; border-top:1px solid var(--rule); font-family:var(--font-serif); font-size:13px; color:var(--graphite);">No "bet now." Primary action is comparison; venue handoff is a neutral link.</div>
</div>
</body></html>
