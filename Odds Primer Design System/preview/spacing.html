<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="margin-bottom:14px;"><span class="eyebrow">Spacing · 4px base</span></div>
  <div style="display:flex; align-items:flex-end; gap:10px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:4px; height:4px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">1·4</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:8px; height:8px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">2·8</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:12px; height:12px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">3·12</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:16px; height:16px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">4·16</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:24px; height:24px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">5·24</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:32px; height:32px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">6·32</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:48px; height:48px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">7·48</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:64px; height:64px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">8·64</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:96px; height:96px; background:var(--ink);"></div><span class="mono" style="font-size:10px; color:var(--graphite-soft);">9·96</span></div>
  </div>
  <div style="margin-top:18px; padding-top:12px; border-top:1px solid var(--rule); font-family:var(--font-serif); font-size:14px; color:var(--graphite);">
    Editorial-generous. The page goes up to 128 because magazine spreads need air.
  </div>
</div>
</body></html>
