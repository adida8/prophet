<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div style="margin-bottom:14px;"><span class="eyebrow">Components · Links · Tags · Venue dots</span></div>
  <div style="display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; align-items:center; gap:18px;">
      <a style="font-family:var(--font-sans); font-size:14px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;">Inline link</a>
      <a style="font-family:var(--font-sans); font-size:14px; color:var(--flame-deep); text-decoration:underline; text-decoration-color:var(--flame); text-underline-offset:3px;">Hover state</a>
      <a style="font-family:var(--font-sans); font-size:14px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px;">External ↗</a>
    </div>
    <div style="display:flex; align-items:center; gap:14px; font-family:var(--font-sans); font-size:14px;">
      <span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:8px; height:8px; border-radius:50%; background:#00C46A;"></span>Kalshi</span>
      <span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:8px; height:8px; border-radius:50%; background:#2A6FDB;"></span>Polymarket</span>
      <span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:8px; height:8px; border-radius:50%; background:#6B7079;"></span>DraftKings</span>
      <span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:8px; height:8px; border-radius:50%; background:#6B7079;"></span>FanDuel</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border:1px solid var(--rule); color:var(--graphite); border-radius:999px;">Tournament</span>
      <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border:1px solid var(--rule); color:var(--graphite); border-radius:999px;">Group stage</span>
      <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; background:var(--ink); color:var(--paper); border-radius:999px;">Outright</span>
      <span style="font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; background:var(--flame-tint); color:var(--flame-deep); border-radius:999px;">† Footnoted</span>
    </div>
  </div>
</div>
</body></html>
